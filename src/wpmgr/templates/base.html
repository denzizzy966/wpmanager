<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}WP Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/datagrid/themes.css">
  <link rel="stylesheet" href="/static/vendor/datagrid/datagrid.css">
  <link rel="stylesheet" href="/static/app/app.css">
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script src="/static/vendor/datagrid/datagrid.js"></script>
  <script src="/static/app/util.js"></script>
</head>
<body>
  <nav class="bilah">
    <strong>WP Manager</strong>
    {% set jalur = request.url.path %}
    <a href="/"{% if jalur == '/' %} class="aktif" aria-current="page"{% endif %}>Kesehatan</a>
    <a href="/updates"{% if jalur.startswith('/updates') %} class="aktif" aria-current="page"{% endif %}>Update</a>
    <a href="/sites"{% if jalur.startswith('/sites') and not jalur.startswith('/sites/new') %} class="aktif" aria-current="page"{% endif %}>Site</a>
    <a href="/keamanan"{% if jalur.startswith('/keamanan') %} class="aktif" aria-current="page"{% endif %}>Keamanan</a>
    <a href="/activity"{% if jalur.startswith('/activity') %} class="aktif" aria-current="page"{% endif %}>Aktivitas</a>
    <a href="/sites/new"{% if jalur.startswith('/sites/new') %} class="aktif" aria-current="page"{% endif %}>Tambah Site</a>
    <form method="post" action="/logout" class="kanan">
      <button type="submit">Keluar</button>
    </form>
  </nav>
  <main>{% block isi %}{% endblock %}</main>
</body>
</html>
