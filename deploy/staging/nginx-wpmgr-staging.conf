# /etc/nginx/sites-enabled/wpmgr-staging.conf -- dipasang SEKALI (spec §7.2).
# Semua <nama>.staging.halosocia.my.id diteruskan ke router staging di
# 127.0.0.1:8090. Sertifikat dibaca per handshake dari
# /var/lib/wpmgr/certs/<host>/, jadi staging baru tidak butuh reload nginx
# host. Selama sertifikat sebuah staging belum terbit, handshake untuk nama
# itu ditolak (dashboard menampilkan "sedang diterbitkan"); staging tetap
# bisa dibuka lewat SSO dashboard setelah terbit.
#
# Nama dari SNI divalidasi lewat map sebelum menjadi bagian path: SNI dikirim
# klien dan bisa berisi apa saja, termasuk "../". Jangkar "$" di akhir pola
# aman dipakai di sini karena SNI tidak pernah memuat baris baru (putusan
# F19). Pola di bawah memuat "{" sehingga WAJIB dikutip (putusan F6): tanpa
# kutip nginx membaca "{" sebagai awal blok, bukan bagian pola. `server_name`
# di kedua server sengaja BUKAN regex (lihat komentar di situ) -- map ini
# tetap satu-satunya validator nama staging.

map $ssl_server_name $wpmgr_stg_host {
    "~^(?<wpmgr_stg_nama>[a-z0-9-]{1,40})\.staging\.halosocia\.my\.id$"  $wpmgr_stg_nama.staging.halosocia.my.id;
    default                                                              tidak-ada;
}

server {
    listen 80;
    listen [::]:80;
    # Wildcard nginx biasa, bukan regex: pencocokan nama tetap lewat map di
    # atas (yang membangun path sertifikat), jadi server_name di sini hanya
    # perlu memilih server block yang benar, tidak perlu validasi ketat.
    server_name *.staging.halosocia.my.id;

    # HTTP-01 untuk certbot --webroot milik skrip pembantu.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/wpmgr/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # TANPA "http2": di nginx 1.24 http2 adalah opsi per SOKET (alamat:port),
    # bukan per server block. VPS ini sudah punya ~19 site lain di
    # "listen 443 ssl;" pada soket yang sama; menambahkan http2 di sini akan
    # menyalakan HTTP/2 untuk soket itu secara keseluruhan, termasuk site
    # yang tidak diminta. Boleh dihidupkan lagi setelah semua site di
    # sites-enabled ikut disiapkan untuk itu (atau di nginx >=1.25.1, tempat
    # http2 sudah jadi directive terpisah per server).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.staging.halosocia.my.id;

    # Path dibangun dari $wpmgr_stg_host (hasil map tervalidasi), bukan dari
    # $ssl_server_name mentah, supaya SNI palsu tidak bisa dipakai membaca
    # sertifikat host staging lain atau melintasi direktori (Koreksi #9).
    # Host yang tidak lolos map jatuh ke "tidak-ada", yang bukan direktori
    # sertifikat siapa pun, jadi handshake-nya ditolak, bukan memuat
    # sertifikat host lain.
    ssl_certificate     /var/lib/wpmgr/certs/$wpmgr_stg_host/fullchain.pem;
    ssl_certificate_key /var/lib/wpmgr/certs/$wpmgr_stg_host/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64M;
    # X-Robots-Tag TIDAK diset di sini: router staging (konf_router() di
    # skrip pembantu) sudah menambahkannya di setiap respons.

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
