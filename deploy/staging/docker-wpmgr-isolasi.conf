# Memasang aturan isolasi iptables wp-manager SEBELUM dockerd menjalankan ulang container
# (kebijakan restart) sesudah boot. Tanda '-': bila gagal, Docker tetap start (container lain
# di VPS tidak boleh ikut mati); wpmgr-staging-siapkan.service memasang ulang sesudahnya.
# timeout 60: docker.service memakai TimeoutStartSec=0, jadi isolasi yang macet tidak boleh
# menahan Docker selamanya.
[Service]
ExecStartPre=-/usr/bin/timeout 60 /usr/local/sbin/wpmgr-staging isolasi
