services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wpmgr
      POSTGRES_PASSWORD: wpmgr
      POSTGRES_DB: wpmgr
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpmgr"]
      interval: 5s
      retries: 10

  wpdb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wp:
    image: wordpress:6.5-php8.1-apache
    depends_on:
      wpdb: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: wpdb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    ports: ["8081:80"]
    volumes:
      # Sumber connector dipasang read-only di luar direktori plugin, lalu
      # disalin ke direktori plugin oleh fixture e2e. Bind mount langsung ke
      # wp-content/plugins membuat self-update WordPress menghapus dan menulis
      # ulang berkas di checkout repo.
      - ./connector/wp-manager-connector:/opt/wpmgr-connector-src:ro

  wpcli:
    image: wordpress:cli-php8.1
    depends_on: [wp]
    user: "33:33"
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      WORDPRESS_DB_HOST: wpdb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes_from: [wp]

volumes:
  pgdata:
