services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wpmgr
      POSTGRES_PASSWORD: wpmgr
      POSTGRES_DB: wpmgr
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpmgr"]
      interval: 5s
      retries: 10

  wpdb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wp:
    image: wordpress:6.5-php8.1-apache
    depends_on:
      wpdb: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: wpdb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    # WPMGR_E2E_WP_PORT: jalankan WordPress e2e di port lain bila 8081 sudah
    # dipakai stack lain (conftest e2e membaca variabel yang sama).
    ports: ["${WPMGR_E2E_WP_PORT:-8081}:80"]
    volumes:
      # Sumber connector dipasang read-only di luar direktori plugin, lalu
      # disalin ke direktori plugin oleh fixture e2e. Bind mount langsung ke
      # wp-content/plugins membuat self-update WordPress menghapus dan menulis
      # ulang berkas di checkout repo.
      - ./connector/wp-manager-connector:/opt/wpmgr-connector-src:ro

  wpcli:
    image: wordpress:cli-php8.1
    depends_on: [wp]
    user: "33:33"
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      WORDPRESS_DB_HOST: wpdb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes_from: [wp]

  # E2E staging (Task 22): skrip pembantu dijalankan di Linux dengan socket
  # Docker Desktop. Profil `staging` supaya `docker compose up -d` biasa
  # tidak membangunnya.
  pembantu:
    profiles: ["staging"]
    build: ./tests/e2e/pembantu
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      WPMGR_STG_KONF: /srv/wpmgr/staging.conf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/staging/wpmgr-staging:/usr/local/sbin/wpmgr-staging:ro
      # WPMGR_E2E_STG_AKAR: pindahkan akar staging e2e ke drive lain bila sisa
      # disk drive repo di bawah 15% (tarik menolaknya, spec §2).
      - ${WPMGR_E2E_STG_AKAR:-./var/e2e-stg}:/srv/wpmgr

volumes:
  pgdata:
