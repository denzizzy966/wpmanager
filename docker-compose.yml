services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wpmgr
      POSTGRES_PASSWORD: wpmgr
      POSTGRES_DB: wpmgr
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpmgr"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
